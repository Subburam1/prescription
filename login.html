<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LeoDass Company</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* General styles for the login page */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5; /* Light background */
            color: #333;
        }

        .login-container {
            display: flex;
            /* Use percentage for responsiveness */
            max-width: 10000px; /* This max-width is very large, effectively making width fixed at 900px */
            width: 900px; /* Fixed width for the container */
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-height: 500px;
            height:600px;/* Slightly reduced min-height */
            /* Center the container in the viewport if not using flex centering on body */
            margin: auto; /* This helps center block elements, but flex on body is better */
        }

        .login-form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; /* Align content to the start */
        }

        .login-form-section .logo-top {
            margin-bottom: -7px; /* This negative margin might pull the logo too far up */
            width: 120px; /* Adjusted logo size */
            height: auto; /* Maintain aspect ratio */
        }

        .login-form-section h2 {
            font-size: 2em; /* Slightly smaller heading */
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .login-form-section p {
            font-size: 0.9em; /* Slightly smaller text */
            color: #666;
            margin-bottom: 30px;
        }

        .login-form {
            width: 100%;
            max-width: 320px; /* Further limit form width for a compact look */
        }

        .form-group {
            margin-bottom: 18px; /* Slightly reduced margin */
        }

        .form-group label {
            display: block;
            margin-bottom: 6px; /* Slightly reduced margin */
            font-weight: 500;
            color: #555;
        }

        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px 12px; /* Slightly reduced padding */
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.95em; /* Slightly smaller font */
            color: #333;
            transition: border-color 0.3s ease;
        }

        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus {
            outline: none;
            border-color: #6a5acd;
        }

        .options-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px; /* Slightly reduced margin */
            font-size: 0.85em; /* Slightly smaller font */
        }

        .remember-me {
            display: flex;
            align-items: center;
        }

        .remember-me input[type="checkbox"] {
            margin-right: 6px; /* Slightly reduced margin */
        }

        .options-group a {
            color: #6a5acd;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .options-group a:hover {
            color: #483d8b;
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 10px 15px; /* Slightly reduced padding */
            background-color: #6a5acd;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1em; /* Slightly smaller font */
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #483d8b;
            transform: translateY(-2px);
        }

        /* Missing Google Sign-in button and link here based on previous code,
           but keeping it as per your provided code snippet. */

        .login-image-section {
            flex: 1;
            background-color: #d4c4f5; /* Background color from the image */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* Keep some padding for the image itself */
        }

        .login-image-section img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Ensures the entire image is visible */
            display: block; /* Ensures no extra space below the image due to inline-block behavior */
        }

        #login-message {
            margin-top: 20px;
            font-weight: 600;
            text-align: center;
            color: #f44336; /* Error color */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column; /* Stack on smaller screens */
                max-width: 450px; /* Adjust max-width for mobile */
                min-height: auto; /* Allow height to adjust */
            }

            .login-form-section {
                padding: 30px;
                align-items: center; /* Center content in column layout */
                text-align: center;
            }

            .login-form-section .logo-top {
                margin-bottom: 20px;
            }

            .login-image-section {
                min-height: 250px; /* Ensure image section has some height on mobile */
                padding: 20px; /* Adjust padding for mobile image */
            }
        }

        @media (max-width: 480px) {
            .login-form-section {
                padding: 20px;
            }
            .login-form-section h2 {
                font-size: 1.6em;
            }
            .login-form-section p {
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-form-section">
            <img src="logo.png" alt="LeoDass Company Logo" class="logo-top">
            <h2>Welcome back</h2>
            <p>Please enter your details</p>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="options-group">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember for 30 days</label>
                    </div>
                    <a href="#">Forgot password</a>
                </div>
                <button type="submit" class="btn-primary">Sign in</button>
                </form>
            <div id="login-message"></div> 

            <div class="signup-link">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
        <div class="login-image-section">
            <img src="o.png" alt="Login Illustration">
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission

            const emailInput = document.getElementById('email').value;
            const passwordInput = document.getElementById('password').value;
            const loginMessage = document.getElementById('login-message'); // This line was failing without the div

            // Hardcoded credentials for demonstration
            const correctEmail = 'team2@gmail.com';
            const correctPassword = 'team2ibm';

            if (emailInput === correctEmail && passwordInput === correctPassword) {
                loginMessage.style.color = '#4CAF50'; // Green for success
                loginMessage.textContent = 'Login Successful! Redirecting...';
                // Redirect to the new dashboard page
                setTimeout(() => {
                    window.location.href = 'dashboard.html'; // <--- This is the key change
                }, 1500); // Redirect after 1.5 seconds
            } else {
                loginMessage.style.color = '#f44336'; // Red for error
                loginMessage.textContent = 'Invalid email or password. Please try again.';
            }
        });
    </script>
</body>
</html>
